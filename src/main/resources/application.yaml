server:
  port: 8080
spring:
  application:
    name: carTask
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cartask}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.95}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_YH22Ad}
      timeout: ${REDIS_TIMEOUT:2s}
      database: 5
cartask:
  sms:
    enabled: ${SMS_ENABLED:false}
    # 临时跳过短信验证：为 true 时既不真发短信也不校验验证码，短信登录/重置密码/换绑手机号都会失去这一步。
    # 默认 false；仅在短信通道不可用期间临时打开，用完立刻改回 false。
    skip-verification: ${SMS_SKIP_VERIFICATION:false}
    access-key-id: ${SMS_ACCESS_KEY_ID:}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:}
    endpoint: ${SMS_ENDPOINT:dysmsapi.aliyuncs.com}
    sign-name: ${SMS_SIGN_NAME:}
    template-code: ${SMS_TEMPLATE_CODE:}
    country-code: ${SMS_COUNTRY_CODE:86}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8090,http://127.0.0.1:8090}
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
    jwt:
      issuer: ${JWT_ISSUER:carTask}
      audience: ${JWT_AUDIENCE:carTask-api}
      active-signing-key-id: ${JWT_ACTIVE_SIGNING_KEY_ID:local}
      keys:
        local: ${JWT_SIGNING_KEY_LOCAL:}
      ttl: ${JWT_TTL:2h}
      clock-skew: ${JWT_CLOCK_SKEW:30s}
      token-storage-encryption-key: ${JWT_STORAGE_ENCRYPTION_KEY:}
      token-storage-encryption-key-id: ${JWT_STORAGE_ENCRYPTION_KEY_ID:local}

app:
  setup:
    # 配置引导模式下校验引导页请求的口令；留空时每次启动随机生成并打印在启动横幅里。
    token: ${SETUP_TOKEN:}
    # 引导进度草稿，填到一半关掉浏览器也能接着填。
    draft-file: ${APP_SETUP_DRAFT_FILE:.setup-draft.json}
  sync:
    task-history-limit: ${SYNC_TASK_HISTORY_LIMIT:50}
  dashboard:
    zone-codes: ${DASHBOARD_ZONE_CODES:1,2}
  account-generate-cron: ${ACCOUNT_GENERATE_CRON:0 0 3 * * *}
  owner-archive-cron: ${OWNER_ARCHIVE_CRON:0 45 2 * * *}
  admin-initializer:
    enabled: ${ADMIN_INITIALIZER_ENABLED:false}
    username: ${ADMIN_INITIALIZER_USERNAME:admin}
    password: ${ADMIN_INITIALIZER_PASSWORD:}
    force-write: ${ADMIN_INITIALIZER_FORCE_WRITE:false}
  mock-data:
    enabled: ${MOCK_DATA_ENABLED:false}
  file:
    storage-root: ${FILE_STORAGE_ROOT:${user.dir}}
    base-url: ${FILE_BASE_URL:}
  logging:
    directory: ${APP_LOG_DIR:${user.dir}/logs}
    time-zone: ${APP_LOG_TIME_ZONE:Asia/Shanghai}
    retention-days: ${APP_LOG_RETENTION_DAYS:30}
    total-size-cap: ${APP_LOG_TOTAL_SIZE_CAP:10GB}
    max-file-size: ${APP_LOG_MAX_FILE_SIZE:256MB}
    max-message-length: ${APP_LOG_MAX_MESSAGE_LENGTH:8192}
    queue-size: ${APP_LOG_QUEUE_SIZE:8192}

keytop:
  base-url: ${KEYTOP_BASE_URL:https://kp-open.keytop.cn/unite-api}
  app-id: ${KEYTOP_APP_ID:0}
  park-id: ${KEYTOP_PARK_ID:}
  park-name: ${KEYTOP_PARK_NAME:}
  app-secret: ${KEYTOP_APP_SECRET:}
  version: ${KEYTOP_VERSION:1.0.0}
  timeout: ${KEYTOP_TIMEOUT:30s}
  area-sync-cron: ${KEYTOP_AREA_SYNC_CRON:0 0 2 * * *}
  car-cap-info-sync-cron: ${KEYTOP_CAR_CAP_INFO_SYNC_CRON:0 */5 * * * *}
  car-cap-info-page-size: ${KEYTOP_CAR_CAP_INFO_PAGE_SIZE:100}
  car-cap-info-overlap-window: ${KEYTOP_CAR_CAP_INFO_OVERLAP_WINDOW:30m}
  car-cap-info-reconciliation-window: ${KEYTOP_CAR_CAP_INFO_RECONCILIATION_WINDOW:72h}
  car-cap-info-reconciliation-cron: ${KEYTOP_CAR_CAP_INFO_RECONCILIATION_CRON:0 30 3 * * *}
