spring:
  application:
    name: carTask
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cartask}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:192.168.1.95}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_YH22Ad}
      timeout: ${REDIS_TIMEOUT:2s}

shopmall:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8090,http://127.0.0.1:8090}
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    login-rate-limit:
      enabled: ${LOGIN_RATE_LIMIT_ENABLED:true}
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
    jwt:
      issuer: ${JWT_ISSUER:carTask}
      audience: ${JWT_AUDIENCE:carTask-api}
      active-signing-key-id: ${JWT_ACTIVE_SIGNING_KEY_ID:local}
      keys:
        local: ${JWT_SIGNING_KEY_LOCAL:}
      ttl: ${JWT_TTL:2h}
      clock-skew: ${JWT_CLOCK_SKEW:30s}
      token-storage-encryption-key: ${JWT_STORAGE_ENCRYPTION_KEY:}
      token-storage-encryption-key-id: ${JWT_STORAGE_ENCRYPTION_KEY_ID:local}

app:
  file:
    storage-root: ${FILE_STORAGE_ROOT:${user.dir}}
    base-url: ${FILE_BASE_URL:}
  logging:
    directory: ${APP_LOG_DIR:${user.dir}/logs}
    time-zone: ${APP_LOG_TIME_ZONE:Asia/Shanghai}
    retention-days: ${APP_LOG_RETENTION_DAYS:30}
    total-size-cap: ${APP_LOG_TOTAL_SIZE_CAP:10GB}
    max-file-size: ${APP_LOG_MAX_FILE_SIZE:256MB}
    max-message-length: ${APP_LOG_MAX_MESSAGE_LENGTH:8192}
    queue-size: ${APP_LOG_QUEUE_SIZE:8192}

keytop:
  base-url: ${KEYTOP_BASE_URL:https://kp-open.keytop.cn/unite-api}
  app-id: ${KEYTOP_APP_ID:0}
  park-id: ${KEYTOP_PARK_ID:}
  app-secret: ${KEYTOP_APP_SECRET:}
  version: ${KEYTOP_VERSION:1.0.0}
  timeout: ${KEYTOP_TIMEOUT:30s}
  area-sync-cron: ${KEYTOP_AREA_SYNC_CRON:0 0 2 * * *}
  car-cap-info-sync-cron: ${KEYTOP_CAR_CAP_INFO_SYNC_CRON:0 */5 * * * *}
  car-cap-info-page-size: ${KEYTOP_CAR_CAP_INFO_PAGE_SIZE:100}
  car-cap-info-lookback-minutes: ${KEYTOP_CAR_CAP_INFO_LOOKBACK_MINUTES:5}
