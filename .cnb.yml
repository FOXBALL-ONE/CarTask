.build-release: &build-release
  name: 构建前端后端并发布
  runner:
    cpus: 8
  docker:
    build:
      dockerfile: .cnb/ci.Dockerfile
      by:
        - .cnb/ci.Dockerfile
        - frontend/package.json
        - frontend/pnpm-lock.yaml
      versionBy:
        - .cnb/ci.Dockerfile
        - frontend/pnpm-lock.yaml
  lock:
    key: build-release
    wait: true
  stages:
    - name: 安装前端依赖
      timeout: 30m
      script: cd frontend && pnpm install --frozen-lockfile
    - name: 构建前端
      timeout: 30m
      script: cd frontend && pnpm exec nuxt build
    - name: 构建后端 JAR
      timeout: 30m
      script: bash ./gradlew clean bootJar --no-daemon
    - name: 准备发布制品
      script: |
        set -euo pipefail
        mkdir -p dist
        test -d frontend/.output
        tar -czf "dist/frontend-${CNB_COMMIT}.tar.gz" -C frontend .output

        shopt -s nullglob
        jars=(build/libs/*.jar)
        if [ "${#jars[@]}" -ne 1 ]; then
          echo "Expected exactly one bootJar in build/libs, found ${#jars[@]}" >&2
          exit 1
        fi
        cp "${jars[0]}" "dist/backend-${CNB_COMMIT}.jar"
    - name: 创建 Release
      type: git:release
      options:
        tag: build-$CNB_COMMIT
        description: Build $CNB_COMMIT
    - name: 上传 Release 制品
      image: cnbcool/attachments:latest
      settings:
        tag: build-$CNB_COMMIT
        attachments:
          - dist/frontend-$CNB_COMMIT.tar.gz
          - dist/backend-$CNB_COMMIT.jar

master:
  push:
    - *build-release

$:
  web_trigger_release:
    - *build-release
