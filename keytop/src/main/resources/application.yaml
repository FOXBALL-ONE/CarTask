spring:
  application:
    name: keytop
  servlet:
    multipart:
      # 容器这道限制只是**兜底**，必须比业务上限大：Spring Boot 默认单文件 1MB，
      # 比业务常量 FACE_PHOTO_MAX_BYTES（2MB）还小，请求在进 Controller 之前就被容器
      # 拦成 413，业务里那句「人脸照片不能超过 2MB」永远执行不到，用户看到的还是英文提示。
      # 设成 5MB 之后：2~5MB 的照片会走到业务校验，得到中文的「人脸照片不能超过 2MB」；
      # 超过 5MB 才由容器兜底拒绝。
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.1.40:5432/keytop}
    username: ${DB_USERNAME:keytop}
    password: ${DB_PASSWORD:eakSQjk3dcphyBZf}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 默认只有 10 个连接：车辆进出记录同步一旦跑起来，就可能把连接占满，
      # 登录等其它请求会在这里排队等到超时，表现为「同步时无法登录」。调大池子
      # 并把等待上限设短一点，让请求快速失败而不是死等半分钟。
      maximum-pool-size: ${DB_HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${DB_HIKARI_MIN_IDLE:20}
      connection-timeout: ${DB_HIKARI_CONNECTION_TIMEOUT:10000}
server:
  port: 8090

keytop:
  app-id: 12250
  park-id: 591007282
  app-secret: secret
  version: 1.0.0
