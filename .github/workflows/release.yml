name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build frontend and backend, then publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: npx nuxt build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build executable Spring Boot JAR
        run: bash ./gradlew clean bootJar --no-daemon

      - name: Prepare release files
        run: |
          mkdir -p dist
          test -d frontend/.output
          tar -czf "dist/frontend-${GITHUB_SHA}.tar.gz" -C frontend .output

          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one bootJar in build/libs, found ${#jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" "dist/backend-${GITHUB_SHA}.jar"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/frontend-${{ github.sha }}.tar.gz
            dist/backend-${{ github.sha }}.jar
